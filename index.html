<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pixel Snapper</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Pixelify+Sans:wght@600&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
/* Idea: hoja de cuadrícula. Escenario con fondo de tablero, controles en tarjetas planas, rojo sprite como acento. */
:root {
  --bg: #eef1f5;
  --surface: #ffffff;
  --ink: #1b2233;
  --muted: #5b6577;
  --line: #d5dae3;
  --accent: #d63a4f;
  --accent-ink: #ffffff;
  --ok: #1f8a4c;
  --err: #c0262d;
  --check-a: #e4e8ee;
  --check-b: #f6f8fb;
  --font-display: "Pixelify Sans", "Courier New", monospace;
  --font-body: "DM Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #11151d; --surface: #1a202c; --ink: #e8ecf4; --muted: #9aa5b8; --line: #2c3547;
    --accent: #ef5a6f; --accent-ink: #1a0b0e; --ok: #4cc382; --err: #ff7b80;
    --check-a: #232b3a; --check-b: #1d2431; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #11151d; --surface: #1a202c; --ink: #e8ecf4; --muted: #9aa5b8; --line: #2c3547;
  --accent: #ef5a6f; --accent-ink: #1a0b0e; --ok: #4cc382; --err: #ff7b80;
  --check-a: #232b3a; --check-b: #1d2431; color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--bg); color: var(--ink);
  font: 400 16px/1.45 var(--font-body);
  -webkit-text-size-adjust: 100%;
}
main { max-width: 720px; margin: 0 auto; padding: 16px 16px 40px; display: flex; flex-direction: column; gap: 14px; }

header h1 { margin: 0; font: 600 28px/1.1 var(--font-display); letter-spacing: .01em; }
header p { margin: 4px 0 0; color: var(--muted); font-size: 15px; text-wrap: balance; }

.card { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 14px; }
.card h2 { margin: 0 0 10px; font-size: 13px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }

/* Escenario */
.tabs { display: flex; gap: 4px; padding: 4px; background: var(--bg); border-radius: 10px; margin-bottom: 10px; }
.tabs button { flex: 1; min-height: 40px; border: 0; border-radius: 7px; background: transparent; color: var(--muted); font: 500 15px var(--font-body); cursor: pointer; }
.tabs button[aria-selected="true"] { background: var(--surface); color: var(--ink); box-shadow: 0 1px 2px rgba(0,0,0,.12); }
.tabs button:disabled { opacity: .45; cursor: default; }

#drop { border-radius: 10px; }
#drop.over { outline: 2px dashed var(--accent); outline-offset: 2px; }
#stage {
  display: grid; place-items: center; min-height: 220px; padding: 12px; border-radius: 10px; border: 1px solid var(--line);
  background-color: var(--check-b);
  background-image:
    linear-gradient(45deg, var(--check-a) 25%, transparent 25%, transparent 75%, var(--check-a) 75%),
    linear-gradient(45deg, var(--check-a) 25%, transparent 25%, transparent 75%, var(--check-a) 75%);
  background-size: 16px 16px; background-position: 0 0, 8px 8px;
}
#cv { display: block; max-width: 100%; }
#empty { color: var(--muted); text-align: center; padding: 24px; }

.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 10px; }
.stat { border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; min-width: 0; }
.stat span { display: block; font-size: 12px; color: var(--muted); }
.stat b { display: block; font: 500 14px var(--font-mono); font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }

#status { min-height: 22px; margin: 10px 0 0; font-size: 14px; color: var(--muted); }
#status[data-kind="ok"] { color: var(--ok); }
#status[data-kind="error"] { color: var(--err); font-weight: 500; }

/* Botones */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 48px; padding: 0 16px;
  border-radius: 10px; border: 1px solid var(--line); background: var(--surface); color: var(--ink);
  font: 500 16px var(--font-body); cursor: pointer; text-align: center; -webkit-tap-highlight-color: transparent;
}
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 700; }
.btn:disabled { opacity: .5; cursor: default; }
.btn:focus-visible, input:focus-visible, textarea:focus-visible, select:focus-visible, .tabs button:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.row { display: flex; gap: 8px; flex-wrap: wrap; }
.row > .btn { flex: 1 1 140px; }
#file, #pal-file { position: absolute; width: 1px; height: 1px; opacity: 0; pointer-events: none; }
.field label.sub { font-size: 13px; color: var(--muted); font-weight: 500; margin-top: 4px; }
.field > label.btn { width: 100%; }
select { font-family: var(--font-body); }

/* Controles */
.field { display: flex; flex-direction: column; gap: 6px; padding: 10px 0; border-top: 1px solid var(--line); }
.field:first-of-type { border-top: 0; padding-top: 0; }
.field label, .field .lbl { font-weight: 500; font-size: 15px; }
.field small { color: var(--muted); font-size: 13px; }
.line { display: flex; align-items: center; gap: 12px; }
.line output { font: 500 15px var(--font-mono); min-width: 3ch; text-align: right; font-variant-numeric: tabular-nums; }
input[type="range"] { flex: 1; min-height: 32px; accent-color: var(--accent); }
input[type="number"], textarea, select {
  width: 100%; min-height: 44px; padding: 8px 10px; border-radius: 8px; border: 1px solid var(--line);
  background: var(--bg); color: var(--ink); font: 500 16px var(--font-mono);
}
textarea { min-height: 72px; resize: vertical; }
.check { display: flex; align-items: center; gap: 10px; min-height: 44px; font-weight: 500; }
.check input { width: 22px; height: 22px; accent-color: var(--accent); }
.chips { display: flex; flex-wrap: wrap; gap: 4px; }
.chip { width: 22px; height: 22px; border-radius: 5px; border: 1px solid var(--line); }

#fallback { margin-top: 12px; text-align: center; }
#fb-img { max-width: 100%; image-rendering: pixelated; border: 1px solid var(--line); border-radius: 8px; background: var(--check-b); }
.hint { color: var(--muted); font-size: 13px; margin: 6px 0 0; }
.foot { color: var(--muted); font-size: 13px; text-align: center; }
.foot a { color: var(--ink); }
@media (prefers-reduced-motion: no-preference) { .btn { transition: transform .08s; } .btn:active { transform: scale(.98); } }

.head { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.lang { display: flex; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; background: var(--surface); flex: none; }
.lang button { min-width: 48px; min-height: 40px; border: 0; background: transparent; color: var(--muted); font: 700 14px var(--font-body); cursor: pointer; }
.lang button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }
.lang button:focus-visible { outline: 3px solid var(--accent); outline-offset: -3px; }
select { font-family: var(--font-body); font-size: 16px; }
</style>
</head>
<body>
<main>
  <header>
    <div class="head">
      <h1>Pixel Snapper</h1>
      <div class="lang" role="group" aria-label="Language / Idioma">
        <button id="lang-en" type="button" aria-pressed="true">EN</button>
        <button id="lang-es" type="button" aria-pressed="false">ES</button>
      </div>
    </div>
    <p data-i18n="subtitle"></p>
  </header>

  <section class="card" data-i18n-aria="previewAria">
    <div class="tabs" role="tablist">
      <button id="tab-orig" role="tab" aria-selected="true" type="button" data-i18n="tabOrig"></button>
      <button id="tab-res" role="tab" aria-selected="false" type="button" disabled data-i18n="tabRes"></button>
    </div>
    <div id="drop">
      <div id="stage">
        <canvas id="cv" hidden></canvas>
        <div id="empty" data-i18n="empty"></div>
      </div>
    </div>
    <div class="stats">
      <div class="stat"><span data-i18n="statSrc"></span><b id="stat-src">–</b></div>
      <div class="stat"><span data-i18n="statOut"></span><b id="stat-out">–</b></div>
      <div class="stat"><span data-i18n="statPx"></span><b id="stat-px">–</b></div>
    </div>
    <p id="status" role="status" aria-live="polite"></p>
  </section>

  <section class="card" data-i18n-aria="imageAria">
    <div class="row">
      <label class="btn" for="file" data-i18n="chooseImage"></label>
      <button class="btn" id="btn-sample" type="button" data-i18n="useSample"></button>
    </div>
    <input id="file" type="file" accept="image/png,image/jpeg,image/*">
    <p class="hint" data-i18n="imageHint"></p>
  </section>

  <section class="card" data-i18n-aria="settingsAria">
    <h2 data-i18n="settings"></h2>
    <div class="field">
      <label for="colors" data-i18n="colorsLabel"></label>
      <div class="line">
        <input id="colors" type="range" min="2" max="64" step="1" value="16">
        <output id="colors-out" for="colors">16</output>
      </div>
      <small data-i18n="colorsHelp"></small>
    </div>
    <div class="field">
      <span class="lbl" data-i18n="pxLabel"></span>
      <label class="check"><input id="px-auto" type="checkbox" checked> <span data-i18n="pxAuto"></span></label>
      <input id="px-size" type="number" inputmode="decimal" min="1" step="0.5" value="8" data-i18n-aria="pxAria">
      <small data-i18n="pxHelp"></small>
    </div>
    <div class="field">
      <label for="preset" data-i18n="paletteLabel"></label>
      <select id="preset" data-i18n-aria="presetAria"></select>
      <label class="btn" for="pal-file" data-i18n="importPng"></label>
      <input id="pal-file" type="file" accept="image/png,image/*">
      <label for="palette" class="sub" data-i18n="hexLabel"></label>
      <textarea id="palette" rows="2" placeholder="0d2b45, ffecd6, d95763" autocapitalize="off" autocomplete="off" spellcheck="false"></textarea>
      <div class="chips" id="chips"></div>
      <small id="pal-info"></small>
    </div>
    <button class="btn primary" id="btn-run" type="button" style="width:100%"></button>
  </section>

  <section class="card" data-i18n-aria="exportAria">
    <h2 data-i18n="export"></h2>
    <div class="field">
      <label for="scale" data-i18n="scaleLabel"></label>
      <select id="scale">
        <option value="1" data-i18n="scale1"></option>
        <option value="4">4×</option>
        <option value="8" selected>8×</option>
        <option value="16">16×</option>
      </select>
    </div>
    <button class="btn primary" id="btn-save" type="button" style="width:100%" disabled data-i18n="download"></button>
    <p class="hint" id="save-info" role="status" aria-live="polite"></p>
    <div id="fallback" hidden><img id="fb-img" data-i18n-alt="fbAlt" alt=""></div>
  </section>

  <p class="foot" data-i18n-html="foot"></p>
  <p class="foot" data-i18n-html="readme"></p>
</main>
<script>
// Port a JavaScript del algoritmo de spritefusion-pixel-snapper (src/lib.rs, MIT).
// Trabaja sobre objetos { width, height, data: Uint8ClampedArray (RGBA) }.
(function (root) {
  "use strict";

  const MAX_PALETTE_COLORS = 256;

  const DEFAULTS = {
    kColors: 16,
    seed: 42,
    maxKmeansIterations: 15,
    peakThresholdMultiplier: 0.2,
    peakDistanceFilter: 4,
    walkerSearchWindowRatio: 0.35,
    walkerMinSearchWindow: 2.0,
    walkerStrengthThreshold: 0.5,
    minCutsPerAxis: 4,
    fallbackTargetSegments: 64,
    maxStepRatio: 1.8,
  };

  function mulberry32(a) {
    return function () {
      a |= 0;
      a = (a + 0x6d2b79f5) | 0;
      let t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  function fail(code, params, msg) {
    const e = new Error(msg || code);
    e.code = code; e.params = params || {};
    return e;
  }

  function validateDimensions(w, h) {
    if (w === 0 || h === 0) throw fail("dims_zero", null, "Image dimensions cannot be zero");
    if (w > 10000 || h > 10000) throw fail("dims_large", null, "Image too large (max 10000x10000)");
  }

  // ---------- Cuantización de color (k-means++) ----------
  function quantizeImage(img, cfg) {
    const w = img.width, h = img.height, data = img.data;
    if (cfg.kColors <= 0) throw fail("k_zero", null, "Number of colors must be greater than 0");
    const n = w * h;

    // Colores únicos (con peso) de los píxeles opacos: equivale a k-means por píxel.
    const uniq = new Map();
    const uid = new Int32Array(n).fill(-1);
    let ur = [], ug = [], ub = [], uw = [];
    let m = 0;
    const opaque = new Uint32Array(n);
    for (let i = 0; i < n; i++) {
      const o = i * 4;
      if (data[o + 3] === 0) continue;
      const key = (data[o] << 16) | (data[o + 1] << 8) | data[o + 2];
      let id = uniq.get(key);
      if (id === undefined) {
        id = ur.length;
        uniq.set(key, id);
        ur.push(data[o]); ug.push(data[o + 1]); ub.push(data[o + 2]); uw.push(0);
      }
      uw[id]++;
      uid[i] = id;
      opaque[m++] = i;
    }
    if (m === 0) return { width: w, height: h, data: new Uint8ClampedArray(data) };

    const U = ur.length;
    const rng = mulberry32(cfg.seed);
    const k = Math.min(cfg.kColors, m);
    const cent = new Float64Array(k * 3);

    const firstPix = opaque[Math.floor(rng() * m)];
    {
      const u = uid[firstPix];
      cent[0] = ur[u]; cent[1] = ug[u]; cent[2] = ub[u];
    }
    const dist = new Float64Array(U).fill(Infinity);
    for (let c = 1; c < k; c++) {
      const lr = cent[(c - 1) * 3], lg = cent[(c - 1) * 3 + 1], lb = cent[(c - 1) * 3 + 2];
      let sum = 0;
      for (let i = 0; i < U; i++) {
        const dr = ur[i] - lr, dg = ug[i] - lg, db = ub[i] - lb;
        const d = dr * dr + dg * dg + db * db;
        if (d < dist[i]) dist[i] = d;
        sum += dist[i] * uw[i];
      }
      let pick;
      if (sum <= 0) {
        pick = uid[opaque[Math.floor(rng() * m)]];
      } else {
        const r = rng() * sum;
        let acc = 0;
        pick = U - 1;
        for (let i = 0; i < U; i++) {
          acc += dist[i] * uw[i];
          if (r < acc) { pick = i; break; }
        }
      }
      cent[c * 3] = ur[pick]; cent[c * 3 + 1] = ug[pick]; cent[c * 3 + 2] = ub[pick];
    }

    const prev = new Float64Array(cent);
    const sums = new Float64Array(k * 3);
    const counts = new Float64Array(k);
    for (let it = 0; it < cfg.maxKmeansIterations; it++) {
      sums.fill(0); counts.fill(0);
      for (let i = 0; i < U; i++) {
        let best = 0, minD = Infinity;
        for (let c = 0; c < k; c++) {
          const dr = ur[i] - cent[c * 3], dg = ug[i] - cent[c * 3 + 1], db = ub[i] - cent[c * 3 + 2];
          const d = dr * dr + dg * dg + db * db;
          if (d < minD) { minD = d; best = c; }
        }
        const wgt = uw[i];
        sums[best * 3] += ur[i] * wgt;
        sums[best * 3 + 1] += ug[i] * wgt;
        sums[best * 3 + 2] += ub[i] * wgt;
        counts[best] += wgt;
      }
      for (let c = 0; c < k; c++) {
        if (counts[c] > 0) {
          cent[c * 3] = sums[c * 3] / counts[c];
          cent[c * 3 + 1] = sums[c * 3 + 1] / counts[c];
          cent[c * 3 + 2] = sums[c * 3 + 2] / counts[c];
        }
      }
      if (it > 0) {
        let maxMove = 0;
        for (let c = 0; c < k; c++) {
          const dr = cent[c * 3] - prev[c * 3], dg = cent[c * 3 + 1] - prev[c * 3 + 1], db = cent[c * 3 + 2] - prev[c * 3 + 2];
          const mv = dr * dr + dg * dg + db * db;
          if (mv > maxMove) maxMove = mv;
        }
        if (maxMove < 0.01) break;
      }
      prev.set(cent);
    }

    // Color final por color único
    const mapR = new Uint8ClampedArray(U), mapG = new Uint8ClampedArray(U), mapB = new Uint8ClampedArray(U);
    for (let i = 0; i < U; i++) {
      let best = 0, minD = Infinity;
      for (let c = 0; c < k; c++) {
        const dr = ur[i] - cent[c * 3], dg = ug[i] - cent[c * 3 + 1], db = ub[i] - cent[c * 3 + 2];
        const d = dr * dr + dg * dg + db * db;
        if (d < minD) { minD = d; best = c; }
      }
      mapR[i] = Math.round(cent[best * 3]);
      mapG[i] = Math.round(cent[best * 3 + 1]);
      mapB[i] = Math.round(cent[best * 3 + 2]);
    }
    const out = new Uint8ClampedArray(data);
    for (let i = 0; i < n; i++) {
      const u = uid[i];
      if (u < 0) continue;
      const o = i * 4;
      out[o] = mapR[u]; out[o + 1] = mapG[u]; out[o + 2] = mapB[u];
    }
    return { width: w, height: h, data: out };
  }

  // ---------- Paleta personalizada ----------
  function parsePaletteHex(value) {
    if (!value || !value.trim()) throw fail("pal_empty", null, "Palette must contain at least one color");
    const seen = new Set();
    const palette = [];
    for (const part of value.split(/[,\s]+/)) {
      if (!part) continue;
      const hex = part.trim().replace(/^#+/, "");
      if (!/^[0-9a-fA-F]{6}$/.test(hex)) {
        throw fail("pal_bad", { part: part.trim() }, "Invalid palette color '" + part.trim() + "': expected a 6-digit hex");
      }
      const c = [parseInt(hex.slice(0, 2), 16), parseInt(hex.slice(2, 4), 16), parseInt(hex.slice(4, 6), 16)];
      const key = (c[0] << 16) | (c[1] << 8) | c[2];
      if (!seen.has(key)) { seen.add(key); palette.push(c); }
    }
    if (palette.length === 0) throw fail("pal_empty", null, "Palette must contain at least one color");
    if (palette.length > MAX_PALETTE_COLORS) throw fail("pal_max", { max: MAX_PALETTE_COLORS }, "Palette supports at most " + MAX_PALETTE_COLORS + " distinct colors");
    return palette;
  }

  function nearestPaletteColor(r, g, b, palette) {
    let best = palette[0], bestD = Infinity;
    for (const c of palette) {
      const dr = r - c[0], dg = g - c[1], db = b - c[2];
      const d = dr * dr + dg * dg + db * db;
      if (d < bestD) { bestD = d; best = c; }
    }
    return best;
  }

  function applyPalette(img, palette) {
    if (!palette.length) throw fail("pal_empty", null, "Palette must contain at least one color");
    const out = new Uint8ClampedArray(img.data);
    const cache = new Map();
    for (let i = 0; i < img.width * img.height; i++) {
      const o = i * 4;
      if (out[o + 3] === 0) continue;
      const key = (out[o] << 16) | (out[o + 1] << 8) | out[o + 2];
      let c = cache.get(key);
      if (!c) { c = nearestPaletteColor(out[o], out[o + 1], out[o + 2], palette); cache.set(key, c); }
      out[o] = c[0]; out[o + 1] = c[1]; out[o + 2] = c[2];
    }
    return { width: img.width, height: img.height, data: out };
  }

  // ---------- Perfiles de gradiente ----------
  function computeProfiles(img) {
    const w = img.width, h = img.height, d = img.data;
    if (w < 3 || h < 3) throw fail("too_small", null, "Image too small (minimum 3x3)");
    const gray = new Float64Array(w * h);
    for (let i = 0; i < w * h; i++) {
      const o = i * 4;
      gray[i] = d[o + 3] === 0 ? 0 : 0.299 * d[o] + 0.587 * d[o + 1] + 0.114 * d[o + 2];
    }
    const col = new Float64Array(w), row = new Float64Array(h);
    for (let y = 0; y < h; y++) {
      for (let x = 1; x < w - 1; x++) {
        col[x] += Math.abs(gray[y * w + x + 1] - gray[y * w + x - 1]);
      }
    }
    for (let x = 0; x < w; x++) {
      for (let y = 1; y < h - 1; y++) {
        row[y] += Math.abs(gray[(y + 1) * w + x] - gray[(y - 1) * w + x]);
      }
    }
    return [col, row];
  }

  function estimateStepSize(profile, cfg) {
    if (profile.length === 0) return null;
    let maxVal = -Infinity;
    for (const v of profile) if (v > maxVal) maxVal = v;
    if (maxVal === 0) return null;
    const threshold = maxVal * cfg.peakThresholdMultiplier;
    const peaks = [];
    for (let i = 1; i < profile.length - 1; i++) {
      if (profile[i] > threshold && profile[i] > profile[i - 1] && profile[i] > profile[i + 1]) peaks.push(i);
    }
    if (peaks.length < 2) return null;
    const clean = [peaks[0]];
    for (let j = 1; j < peaks.length; j++) {
      if (peaks[j] - clean[clean.length - 1] > cfg.peakDistanceFilter - 1) clean.push(peaks[j]);
    }
    if (clean.length < 2) return null;
    const diffs = [];
    for (let i = 1; i < clean.length; i++) diffs.push(clean[i] - clean[i - 1]);
    diffs.sort((a, b) => a - b);
    return diffs[Math.floor(diffs.length / 2)];
  }

  function resolveStepSizes(sxO, syO, width, height, cfg) {
    if (cfg.pixelSize != null) return [cfg.pixelSize, cfg.pixelSize];
    if (sxO != null && syO != null) {
      const ratio = sxO > syO ? sxO / syO : syO / sxO;
      if (ratio > cfg.maxStepRatio) {
        const s = Math.min(sxO, syO);
        return [s, s];
      }
      const avg = (sxO + syO) / 2;
      return [avg, avg];
    }
    if (sxO != null) return [sxO, sxO];
    if (syO != null) return [syO, syO];
    const f = Math.max(Math.min(width, height) / cfg.fallbackTargetSegments, 1);
    return [f, f];
  }

  // ---------- Caminante elástico ----------
  function walk(profile, stepSize, limit, cfg) {
    if (profile.length === 0) throw fail("internal", null, "Cannot walk an empty profile");
    const cuts = [0];
    let cur = 0;
    const sw = Math.max(stepSize * cfg.walkerSearchWindowRatio, cfg.walkerMinSearchWindow);
    let mean = 0;
    for (const v of profile) mean += v;
    mean /= profile.length;

    while (cur < limit) {
      const target = cur + stepSize;
      if (target >= limit) { cuts.push(limit); break; }
      const start = Math.max(Math.max(0, Math.trunc(target - sw)), Math.trunc(cur + 1));
      const end = Math.min(Math.max(0, Math.trunc(target + sw)), limit);
      if (end <= start) { cur = target; continue; }
      let maxVal = -1, maxIdx = start;
      for (let i = start; i < end && i < profile.length; i++) {
        if (profile[i] > maxVal) { maxVal = profile[i]; maxIdx = i; }
      }
      if (maxVal > mean * cfg.walkerStrengthThreshold) {
        cuts.push(maxIdx);
        cur = maxIdx;
      } else {
        cuts.push(Math.trunc(target));
        cur = target;
      }
    }
    return cuts;
  }

  function sanitizeCuts(cuts, limit) {
    if (limit === 0) return [0];
    let hasZero = false, hasLimit = false;
    cuts = cuts.slice();
    for (let i = 0; i < cuts.length; i++) {
      if (cuts[i] === 0) hasZero = true;
      if (cuts[i] >= limit) cuts[i] = limit;
      if (cuts[i] === limit) hasLimit = true;
    }
    if (!hasZero) cuts.push(0);
    if (!hasLimit) cuts.push(limit);
    cuts.sort((a, b) => a - b);
    return cuts.filter((v, i) => i === 0 || v !== cuts[i - 1]);
  }

  function snapUniformCuts(profile, limit, targetStep, cfg, minRequired) {
    if (limit === 0) return [0];
    if (limit === 1) return [0, 1];

    let desired = Number.isFinite(targetStep) && targetStep > 0 ? Math.round(limit / targetStep) : 0;
    desired = Math.min(Math.max(Math.max(desired, Math.max(minRequired - 1, 0)), 1), limit);

    const cellWidth = limit / desired;
    const sw = Math.max(cellWidth * cfg.walkerSearchWindowRatio, cfg.walkerMinSearchWindow);
    let mean = 0;
    if (profile.length) { for (const v of profile) mean += v; mean /= profile.length; }

    const cuts = [0];
    for (let idx = 1; idx < desired; idx++) {
      const target = cellWidth * idx;
      const prev = cuts[cuts.length - 1];
      if (prev + 1 >= limit) break;
      let start = Math.max(Math.max(Math.floor(target - sw), prev + 1), 0);
      let end = Math.min(Math.ceil(target + sw), limit - 1);
      if (end < start) { start = prev + 1; end = start; }
      const last = Math.max(profile.length - 1, 0);
      let bestIdx = Math.min(start, last);
      let bestVal = -1;
      for (let i = start; i <= Math.min(end, last); i++) {
        const v = i < profile.length ? profile[i] : 0;
        if (v > bestVal) { bestVal = v; bestIdx = i; }
      }
      if (bestVal < mean * cfg.walkerStrengthThreshold) {
        let fb = Math.round(target);
        if (fb <= prev) fb = prev + 1;
        if (fb >= limit) fb = Math.max(limit - 1, prev + 1);
        bestIdx = fb;
      }
      cuts.push(bestIdx);
    }
    if (cuts[cuts.length - 1] !== limit) cuts.push(limit);
    return sanitizeCuts(cuts, limit);
  }

  function stabilizeCuts(profile, cuts, limit, siblingCuts, siblingLimit, cfg) {
    if (limit === 0) return [0];
    cuts = sanitizeCuts(cuts, limit);
    const minRequired = Math.min(Math.max(cfg.minCutsPerAxis, 2), limit + 1);
    const axisCells = Math.max(cuts.length - 1, 0);
    const siblingCells = Math.max(siblingCuts.length - 1, 0);
    const siblingHasGrid = siblingLimit > 0 && siblingCells >= Math.max(minRequired - 1, 0) && siblingCells > 0;
    let skewed = false;
    if (siblingHasGrid && axisCells > 0) {
      const axisStep = limit / axisCells;
      const sibStep = siblingLimit / siblingCells;
      const ratio = axisStep / sibStep;
      skewed = ratio > cfg.maxStepRatio || ratio < 1 / cfg.maxStepRatio;
    }
    const hasEnough = cuts.length >= minRequired;
    if (hasEnough && !skewed) return cuts;

    let target;
    if (siblingHasGrid) target = siblingLimit / siblingCells;
    else if (cfg.fallbackTargetSegments > 1) target = limit / cfg.fallbackTargetSegments;
    else if (axisCells > 0) target = limit / axisCells;
    else target = limit;
    if (!Number.isFinite(target) || target <= 0) target = 1;
    return snapUniformCuts(profile, limit, target, cfg, minRequired);
  }

  function stabilizeBothAxes(px, py, rawCols, rawRows, width, height, cfg) {
    const col1 = stabilizeCuts(px, rawCols, width, rawRows, height, cfg);
    const row1 = stabilizeCuts(py, rawRows, height, rawCols, width, cfg);

    const colCells = Math.max(Math.max(col1.length - 1, 0), 1);
    const rowCells = Math.max(Math.max(row1.length - 1, 0), 1);
    const colStep = width / colCells;
    const rowStep = height / rowCells;
    const ratio = colStep > rowStep ? colStep / rowStep : rowStep / colStep;

    if (ratio > cfg.maxStepRatio) {
      const target = Math.min(colStep, rowStep);
      const fc = colStep > target * 1.2 ? snapUniformCuts(px, width, target, cfg, cfg.minCutsPerAxis) : col1;
      const fr = rowStep > target * 1.2 ? snapUniformCuts(py, height, target, cfg, cfg.minCutsPerAxis) : row1;
      return [fc, fr];
    }
    return [col1, row1];
  }

  // ---------- Remuestreo por color dominante ----------
  function resample(img, cols, rows) {
    if (cols.length < 2 || rows.length < 2) throw fail("internal", null, "Not enough grid cuts to resample");
    const outW = cols.length - 1, outH = rows.length - 1;
    const out = new Uint8ClampedArray(outW * outH * 4);
    const src = new Uint32Array(img.data.buffer, img.data.byteOffset, img.width * img.height);
    const w = img.width, h = img.height;
    const little = new Uint8Array(new Uint32Array([1]).buffer)[0] === 1;

    for (let yi = 0; yi < outH; yi++) {
      const ys = rows[yi], ye = rows[yi + 1];
      for (let xi = 0; xi < outW; xi++) {
        const xs = cols[xi], xe = cols[xi + 1];
        if (xe <= xs || ye <= ys) continue;
        const counts = new Map();
        for (let y = ys; y < ye && y < h; y++) {
          for (let x = xs; x < xe && x < w; x++) {
            const v = src[y * w + x];
            counts.set(v, (counts.get(v) || 0) + 1);
          }
        }
        let bestV = 0, bestC = -1, bestKey = 0;
        for (const [v, c] of counts) {
          // Desempate: menor [r,g,b,a] lexicográfico
          const key = little
            ? ((((v & 0xff) << 24) | (((v >>> 8) & 0xff) << 16) | (((v >>> 16) & 0xff) << 8) | ((v >>> 24) & 0xff)) >>> 0)
            : v >>> 0;
          if (c > bestC || (c === bestC && key < bestKey)) { bestC = c; bestV = v; bestKey = key; }
        }
        const o = (yi * outW + xi) * 4;
        if (bestC >= 0) {
          out[o] = little ? bestV & 0xff : (bestV >>> 24) & 0xff;
          out[o + 1] = little ? (bestV >>> 8) & 0xff : (bestV >>> 16) & 0xff;
          out[o + 2] = little ? (bestV >>> 16) & 0xff : (bestV >>> 8) & 0xff;
          out[o + 3] = little ? (bestV >>> 24) & 0xff : bestV & 0xff;
        }
      }
    }
    return { width: outW, height: outH, data: out };
  }

  // ---------- Entrada principal ----------
  // opts: { kColors, pixelSize (número o null), palette ([[r,g,b],...] o null) }
  function processImage(img, opts) {
    const cfg = Object.assign({}, DEFAULTS, opts || {});
    const width = img.width, height = img.height;
    validateDimensions(width, height);
    if (cfg.pixelSize != null) {
      const px = cfg.pixelSize;
      if (!Number.isFinite(px) || px < 1 || px > Math.min(width, height) / 2) {
        throw fail("px_range", { px: px, max: Math.floor(Math.min(width, height) / 2) }, "Pixel size " + px + " is out of range")
      }
    }

    const analysis = quantizeImage(img, cfg);
    const [profX, profY] = computeProfiles(analysis);
    const sx = estimateStepSize(profX, cfg);
    const sy = estimateStepSize(profY, cfg);
    const [stepX, stepY] = resolveStepSizes(sx, sy, width, height, cfg);

    const rawCols = walk(profX, stepX, width, cfg);
    const rawRows = walk(profY, stepY, height, cfg);
    const [cols, rows] = stabilizeBothAxes(profX, profY, rawCols, rawRows, width, height, cfg);

    let snapped = resample(analysis, cols, rows);
    if (cfg.palette && cfg.palette.length) snapped = applyPalette(snapped, cfg.palette);

    return {
      image: snapped,
      pixelSize: stepX,
      overridden: cfg.pixelSize != null,
      outWidth: cols.length - 1,
      outHeight: rows.length - 1,
    };
  }

  const api = { processImage, parsePaletteHex, DEFAULTS };
  if (typeof module !== "undefined" && module.exports) module.exports = api;
  else root.PixelSnapper = api;
})(typeof window !== "undefined" ? window : globalThis);

// Imagen de ejemplo: sprite de 16x16 ampliado con proporción irregular, desenfoque y ruido,
// parecido al pixel art "sucio" que genera una IA.
(function (root) {
  "use strict";
  const SPRITE = [
    "................",
    "......kkkk......",
    "....kkrrrrkk....",
    "...krrrwwrrrk...",
    "..krrwwrrrrrrk..",
    "..krwwrrrrwwrk..",
    ".krrrrrrrrwwrrk.",
    ".krrrrwwrrrrrrk.",
    ".krrrrwwrrrrrrk.",
    ".kwwrrrrrrrrwwk.",
    "..kkwwrrrrwwkk..",
    "...kkkwwwwkkk...",
    "....kcccccck....",
    "....kcckkcck....",
    ".....kk..kk.....",
    "................",
  ];
  const COLORS = {
    ".": [0, 0, 0, 0],
    k: [34, 32, 52, 255],
    r: [217, 87, 99, 255],
    w: [255, 236, 214, 255],
    c: [251, 242, 54, 255],
  };

  function makeSample() {
    const W = 136, H = 128, n = 16;
    const a = new Float32Array(W * H * 4);
    for (let y = 0; y < H; y++) {
      for (let x = 0; x < W; x++) {
        const c = COLORS[SPRITE[Math.floor((y * n) / H)][Math.floor((x * n) / W)]];
        const o = (y * W + x) * 4;
        a[o] = c[0]; a[o + 1] = c[1]; a[o + 2] = c[2]; a[o + 3] = c[3];
      }
    }
    // desenfoque [1 2 1] en horizontal y vertical
    const tmp = new Float32Array(a.length);
    for (let pass = 0; pass < 2; pass++) {
      const src = pass === 0 ? a : tmp, dst = pass === 0 ? tmp : a;
      for (let y = 0; y < H; y++) {
        for (let x = 0; x < W; x++) {
          for (let ch = 0; ch < 4; ch++) {
            const p = pass === 0 ? [x - 1, y, x, y, x + 1, y] : [x, y - 1, x, y, x, y + 1];
            const g = (px, py) => src[(Math.min(H - 1, Math.max(0, py)) * W + Math.min(W - 1, Math.max(0, px))) * 4 + ch];
            dst[(y * W + x) * 4 + ch] = (g(p[0], p[1]) + 2 * g(p[2], p[3]) + g(p[4], p[5])) / 4;
          }
        }
      }
    }
    // ruido determinista
    let s = 12345;
    const rnd = () => { s = (Math.imul(s, 1664525) + 1013904223) | 0; return ((s >>> 8) & 0xffff) / 0xffff; };
    const data = new Uint8ClampedArray(W * H * 4);
    for (let i = 0; i < W * H; i++) {
      const o = i * 4;
      const al = a[o + 3];
      for (let ch = 0; ch < 3; ch++) data[o + ch] = a[o + ch] + (al > 0 ? Math.round((rnd() * 2 - 1) * 7) : 0);
      data[o + 3] = al < 8 ? 0 : Math.round(al);
    }
    return { width: W, height: H, data };
  }

  const api = { makeSample };
  if (typeof module !== "undefined" && module.exports) module.exports = api;
  else root.PixelSnapperSample = api;
})(typeof window !== "undefined" ? window : globalThis);

</script>

  const MAX_PIXELS = 6000000;
  let src = null;          // { width, height, data }
  let srcKey = "sampleName"; // nombre base del archivo: clave i18n o nombre real
  let srcFile = null;
  let result = null;       // resultado de processImage
  let view = "orig";       // "orig" | "res"
  let busy = false;
  let stale = true;

  // Mensajes dinámicos guardados como clave para poder re-traducirlos al cambiar de idioma
  let statusState = { key: "", params: null, kind: "", raw: null };
  let saveState = null;    // { key, params }
  let palInfoState = null; // { n } cuando se importó un PNG

  function setStatus(key, params, kind) { statusState = { key: key || "", params: params || null, kind: kind || "", raw: null }; renderStatus(); }
  function setStatusError(prefixKey, e) { statusState = { key: prefixKey || "", params: null, kind: "error", raw: e }; renderStatus(); }
  function renderStatus() {
    const st = statusState;
    let msg = "";
    if (st.raw) msg = st.key ? t(st.key, { msg: errMsg(st.raw) }) : errMsg(st.raw);
    else if (st.key) msg = t(st.key, st.params);
    els.status.textContent = msg;
    els.status.dataset.kind = st.kind;
  }
  function setSaveInfo(key, params) { saveState = key ? { key: key, params: params || null } : null; renderSaveInfo(); }
  function renderSaveInfo() { els.saveInfo.textContent = saveState ? t(saveState.key, saveState.params) : ""; }

  // ---------- Dibujo ----------
  function drawTo(canvas, img) {
    canvas.width = img.width;
    canvas.height = img.height;
    const ctx = canvas.getContext("2d");
    ctx.putImageData(new ImageData(new Uint8ClampedArray(img.data), img.width, img.height), 0, 0);
  }

  function render() {
    const img = view === "res" && result ? result.image : src;
    els.tabOrig.setAttribute("aria-selected", String(view === "orig"));
    els.tabRes.setAttribute("aria-selected", String(view === "res"));
    els.tabRes.disabled = !result;
    if (!img) { els.empty.hidden = false; els.cv.hidden = true; return; }
    els.empty.hidden = true; els.cv.hidden = false;
    drawTo(els.cv, img);
    layoutCanvas(img);
  }

  function layoutCanvas(img) {
    img = img || (view === "res" && result ? result.image : src);
    if (!img) return;
    const maxW = els.stage.clientWidth - 24;
    const maxH = Math.min(window.innerHeight * 0.58, 520);
    let scale = Math.min(maxW / img.width, maxH / img.height);
    if (scale >= 1) scale = Math.floor(scale); // píxeles nítidos al ampliar
    els.cv.style.width = Math.max(1, Math.round(img.width * scale)) + "px";
    els.cv.style.height = Math.max(1, Math.round(img.height * scale)) + "px";
    els.cv.style.imageRendering = scale >= 1 ? "pixelated" : "auto";
  }

  function updateStats() {
    els.statSrc.textContent = src ? src.width + " × " + src.height : "–";
    if (result) {
      els.statOut.textContent = result.outWidth + " × " + result.outHeight;
      els.statPx.textContent = result.pixelSize.toFixed(1) + " px (" + t(result.overridden ? "manual" : "auto") + ")";
    } else {
      els.statOut.textContent = "–";
      els.statPx.textContent = "–";
    }
    els.run.disabled = !src || busy;
    els.save.disabled = !result;
    els.run.textContent = t(stale && result ? "rerun" : "run");
  }

  // ---------- Carga ----------
  function loadSample() {
    src = window.PixelSnapperSample.makeSample();
    srcKey = "sampleName"; srcFile = null;
    afterLoad();
  }

  function loadFile(file) {
    if (!file) return;
    if (!/^image\//.test(file.type) && !/\.(png|jpe?g|webp|gif|bmp)$/i.test(file.name)) {
      setStatus("notImage", null, "error");
      return;
    }
    const url = URL.createObjectURL(file);
    const im = new Image();
    im.onload = function () {
      try {
        if (im.naturalWidth * im.naturalHeight > MAX_PIXELS) {
          setStatus("tooBig", null, "error");
          return;
        }
        const c = document.createElement("canvas");
        c.width = im.naturalWidth; c.height = im.naturalHeight;
        const ctx = c.getContext("2d", { willReadFrequently: true });
        ctx.drawImage(im, 0, 0);
        const d = ctx.getImageData(0, 0, c.width, c.height);
        src = { width: d.width, height: d.height, data: d.data };
        srcKey = null; srcFile = file.name.replace(/\.[^.]+$/, "") || null;
        afterLoad();
      } catch (e) {
        setStatusError("readFail", e);
      } finally {
        URL.revokeObjectURL(url);
      }
    };
    im.onerror = function () {
      URL.revokeObjectURL(url);
      setStatus("openFail", null, "error");
    };
    im.src = url;
  }

  function afterLoad() {
    result = null; stale = true; view = "orig";
    els.fallback.hidden = true;
    setSaveInfo(null);
    render(); updateStats();
    setStatus("");
    run();
  }

  // ---------- Procesado ----------
  function readOptions() {
    const k = parseInt(els.colors.value, 10);
    const opts = { kColors: k >= 1 ? k : 16, pixelSize: null, palette: null };
    if (!els.auto.checked) {
      const v = parseFloat(els.px.value);
      if (!(v > 0)) { const e = new Error("pxNeed"); e.code = "pxNeed"; throw e; }
      opts.pixelSize = v;
    }
    const pal = els.palette.value.trim();
    if (pal) opts.palette = PS.parsePaletteHex(pal);
    return opts;
  }

  function run() {
    if (!src || busy) return;
    let opts;
    try { opts = readOptions(); }
    catch (e) {
      if (e.code === "pxNeed") setStatus("pxNeed", null, "error"); else setStatusError("", e);
      return;
    }
    busy = true; updateStats();
    setStatus("processing", null, "busy");
    setTimeout(function () {
      try {
        const t0 = performance.now();
        result = PS.processImage(src, opts);
        stale = false; view = "res";
        els.fallback.hidden = true;
        setStatus("done", { ms: Math.max(1, Math.round(performance.now() - t0)) }, "ok");
      } catch (e) {
        setStatusError("", e);
      } finally {
        busy = false; render(); updateStats();
      }
    }, 30);
  }

  function markStale() { if (result) { stale = true; updateStats(); } }

  // ---------- Exportar ----------
  function scaledCanvas(img, s) {
    const small = document.createElement("canvas");
    drawTo(small, img);
    if (s === 1) return small;
    const big = document.createElement("canvas");
    big.width = img.width * s; big.height = img.height * s;
    const ctx = big.getContext("2d");
    ctx.imageSmoothingEnabled = false;
    ctx.drawImage(small, 0, 0, big.width, big.height);
    return big;
  }

  function toBlob(canvas) {
    return new Promise(function (res, rej) {
      canvas.toBlob(function (b) { b ? res(b) : rej(new Error("png")); }, "image/png");
    });
  }

  async function save() {
    if (!result) return;
    const s = parseInt(els.scale.value, 10) || 1;
    setSaveInfo(null);
    let blob;
    try {
      blob = await toBlob(scaledCanvas(result.image, s));
    } catch (e) { setStatus("pngFail", null, "error"); return; }
    const base = srcFile || t(srcKey || "imageName");
    const filename = base + "_snapped" + (s > 1 ? "_x" + s : "") + ".png";

    let dl = null;
    try { dl = window.claude && window.claude.use ? await window.claude.use("downloads") : null; } catch (e) { dl = null; }
    if (dl) {
      try {
        await dl.save({ filename: filename, data: blob });
        setSaveInfo("saved", { name: filename });
        return;
      } catch (e) {
        if (e && e.code === "declined") { setSaveInfo("cancelled"); return; }
      }
    }
    // Alternativa: mostrar la imagen para guardarla con pulsación larga
    if (els.fbImg.dataset.url) URL.revokeObjectURL(els.fbImg.dataset.url);
    const url = URL.createObjectURL(blob);
    els.fbImg.dataset.url = url;
    els.fbImg.src = url;
    els.fallback.hidden = false;
    setSaveInfo("longPress");
  }

  // ---------- Paleta: chips ----------
  function renderChips() {
    els.chips.textContent = "";
    const v = els.palette.value.trim();
    if (!v) return;
    try {
      PS.parsePaletteHex(v).forEach(function (c) {
        const s = document.createElement("span");
        s.className = "chip";
        s.style.background = "rgb(" + c[0] + "," + c[1] + "," + c[2] + ")";
        s.title = "#" + c.map((n) => n.toString(16).padStart(2, "0")).join("");
        els.chips.appendChild(s);
      });
    } catch (e) { /* se informa al procesar */ }
  }

  // ---------- Paletas predefinidas e importación PNG ----------
  const presetEl = $("preset"), palFile = $("pal-file"), palInfo = $("pal-info");
  const CUSTOM = "custom";

  const optNone = document.createElement("option");
  optNone.value = "";
  presetEl.appendChild(optNone);
  PRESETS.forEach(function (p) {
    const o = document.createElement("option");
    o.value = p.id; o.textContent = p.name;
    presetEl.appendChild(o);
  });
  const optCustom = document.createElement("option");
  optCustom.value = CUSTOM; optCustom.hidden = true;
  presetEl.appendChild(optCustom);

  function renderPalInfo() { palInfo.textContent = palInfoState ? t("palImported", palInfoState) : t("palInfo"); }

  function setPalette(hexList, presetValue) {
    els.palette.value = hexList.join(", ");
    presetEl.value = presetValue;
    renderChips(); markStale();
    if (src) run();
  }

  presetEl.addEventListener("change", function () {
    palInfoState = null; renderPalInfo();
    const p = PRESETS.find(function (x) { return x.id === presetEl.value; });
    if (p) setPalette(p.colors, p.id);
    else { els.palette.value = ""; renderChips(); markStale(); if (src) run(); }
  });

  palFile.addEventListener("change", function () {
    const file = palFile.files[0];
    palFile.value = "";
    if (!file) return;
    const url = URL.createObjectURL(file);
    const im = new Image();
    function failWith(key) { const e = new Error(key); e.code = key; throw e; }
    im.onload = function () {
      try {
        if (im.naturalWidth * im.naturalHeight > 1000000) failWith("palTooBig");
        const c = document.createElement("canvas");
        c.width = im.naturalWidth; c.height = im.naturalHeight;
        const ctx = c.getContext("2d", { willReadFrequently: true });
        ctx.drawImage(im, 0, 0);
        const d = ctx.getImageData(0, 0, c.width, c.height).data;
        const seen = new Set(), list = [];
        for (let i = 0; i < d.length; i += 4) {
          if (d[i + 3] === 0) continue;
          const key = (d[i] << 16) | (d[i + 1] << 8) | d[i + 2];
          if (!seen.has(key)) {
            seen.add(key);
            list.push(key.toString(16).padStart(6, "0"));
            if (list.length > 256) break;
          }
        }
        if (list.length === 0) failWith("palNoColors");
        if (list.length > 256) failWith("palOver");
        palInfoState = { n: list.length };
        setPalette(list, CUSTOM);
        renderPalInfo();
        setStatus("");
      } catch (e) {
        const known = ["palTooBig", "palNoColors", "palOver"].indexOf(e.code) >= 0;
        statusState = { key: "palImportFail", params: null, kind: "error", raw: { code: known ? e.code : "internal" } };
        renderStatus();
      } finally { URL.revokeObjectURL(url); }
    };
    im.onerror = function () {
      URL.revokeObjectURL(url);
      setStatus("palOpenFail", null, "error");
    };
    im.src = url;
  });

  // ---------- Idioma ----------
  function applyLang() {
    document.documentElement.lang = lang;
    document.querySelectorAll("[data-i18n]").forEach(function (n) { n.textContent = t(n.getAttribute("data-i18n")); });
    document.querySelectorAll("[data-i18n-aria]").forEach(function (n) { n.setAttribute("aria-label", t(n.getAttribute("data-i18n-aria"))); });
    document.querySelectorAll("[data-i18n-alt]").forEach(function (n) { n.setAttribute("alt", t(n.getAttribute("data-i18n-alt"))); });
    document.querySelectorAll("[data-i18n-html]").forEach(function (n) { n.innerHTML = t(n.getAttribute("data-i18n-html")); });
    optNone.textContent = t("none");
    optCustom.textContent = t("custom");
    els.langEn.setAttribute("aria-pressed", String(lang === "en"));
    els.langEs.setAttribute("aria-pressed", String(lang === "es"));
    renderPalInfo(); renderStatus(); renderSaveInfo(); updateStats();
  }
  function setLang(l) {
    lang = l;
    try { localStorage.setItem("pixel-snapper-lang", l); } catch (e) { /* sin almacenamiento */ }
    applyLang();
  }
  els.langEn.addEventListener("click", function () { setLang("en"); });
  els.langEs.addEventListener("click", function () { setLang("es"); });

  // ---------- Eventos ----------
  els.file.addEventListener("change", function () { loadFile(els.file.files[0]); els.file.value = ""; });
  els.sample.addEventListener("click", loadSample);
  els.run.addEventListener("click", run);
  els.save.addEventListener("click", save);
  els.tabOrig.addEventListener("click", function () { view = "orig"; render(); });
  els.tabRes.addEventListener("click", function () { if (result) { view = "res"; render(); } });
  els.colors.addEventListener("input", function () { els.colorsOut.textContent = els.colors.value; markStale(); });
  els.auto.addEventListener("change", function () { els.px.disabled = els.auto.checked; markStale(); });
  els.px.addEventListener("input", markStale);
  els.palette.addEventListener("input", function () {
    presetEl.value = els.palette.value.trim() ? CUSTOM : "";
    palInfoState = null; renderPalInfo();
    renderChips(); markStale();
  });
  window.addEventListener("resize", function () { layoutCanvas(); });

  ["dragenter", "dragover"].forEach(function (ev) {
    els.drop.addEventListener(ev, function (e) { e.preventDefault(); els.drop.classList.add("over"); });
  });
  ["dragleave", "drop"].forEach(function (ev) {
    els.drop.addEventListener(ev, function (e) { e.preventDefault(); els.drop.classList.remove("over"); });
  });
  els.drop.addEventListener("drop", function (e) {
    const f = e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files[0];
    if (f) loadFile(f);
  });

  // Estado inicial: ejemplo ya procesado
  els.px.disabled = els.auto.checked;
  els.colorsOut.textContent = els.colors.value;
  applyLang();
  loadSample();
})();

</script>
</body>
</html>
